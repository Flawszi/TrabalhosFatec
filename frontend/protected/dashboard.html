<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Produtos</title><link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header><div class="container header-flex">
    <div class="brand"><img src="/assets/logo-cliente.svg" class="logo" alt="Logo do cliente parceiro"><div><h1>Sistema de Gestão de Produtos</h1><p>Área protegida - MVC, DAO, MySQL e controle de acesso</p></div></div>
    <div class="sessao"><span id="usuarioLogado"></span><button id="btnLogout" class="btn secundario">Sair</button></div>
  </div></header>
  <main class="container">
    <section id="adminCard" class="card oculto">
      <h2 id="tituloFormulario">Cadastrar Produto</h2>
      <form id="produtoForm"><input type="hidden" id="produtoId">
        <div class="grid">
          <div class="campo"><label for="nome">Nome</label><input id="nome" maxlength="100" required></div>
          <div class="campo"><label for="categoria">Categoria</label><input id="categoria" maxlength="80" required></div>
          <div class="campo"><label for="preco">Preço</label><input id="preco" type="number" min="0" step="0.01" required></div>
          <div class="campo"><label for="quantidade">Quantidade</label><input id="quantidade" type="number" min="0" step="1" required></div>
        </div>
        <div class="acoes"><button class="btn principal" id="btnSalvar">Cadastrar</button><button type="button" class="btn secundario oculto" id="btnCancelar">Cancelar edição</button></div>
      </form><div id="mensagem" class="mensagem" aria-live="polite"></div>
    </section>
    <section class="card"><div class="cabecalho-lista"><div><h2>Produtos Cadastrados</h2><p id="avisoPerfil" class="subtitulo"></p></div><button type="button" class="btn secundario" id="btnAtualizar">Atualizar lista</button></div>
      <div class="tabela-wrapper"><table><thead><tr><th>ID</th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Quantidade</th><th>Ações</th></tr></thead><tbody id="listaProdutos"></tbody></table></div>
      <p id="semProdutos" class="sem-produtos oculto">Nenhum produto cadastrado.</p>
    </section>
  </main><script src="/js/produtos.js"></script>
</body></html>
