<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestão de Produtos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>Sistema de Gestão de Produtos</h1>
      <p>CRUD completo com Node.js, Express, MVC, DAO e MySQL</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2 id="tituloFormulario">Cadastrar Produto</h2>
      <form id="produtoForm">
        <input type="hidden" id="produtoId">
        <div class="grid">
          <div class="campo"><label for="nome">Nome</label><input type="text" id="nome" maxlength="100" required></div>
          <div class="campo"><label for="categoria">Categoria</label><input type="text" id="categoria" maxlength="80" required></div>
          <div class="campo"><label for="preco">Preço</label><input type="number" id="preco" min="0" step="0.01" required></div>
          <div class="campo"><label for="quantidade">Quantidade</label><input type="number" id="quantidade" min="0" step="1" required></div>
        </div>
        <div class="acoes">
          <button type="submit" class="btn principal" id="btnSalvar">Cadastrar</button>
          <button type="button" class="btn secundario oculto" id="btnCancelar">Cancelar edição</button>
        </div>
      </form>
      <div id="mensagem" class="mensagem"></div>
    </section>

    <section class="card">
      <div class="cabecalho-lista">
        <h2>Produtos Cadastrados</h2>
        <button type="button" class="btn secundario" id="btnAtualizar">Atualizar lista</button>
      </div>
      <div class="tabela-wrapper">
        <table>
          <thead><tr><th>ID</th><th>Nome</th><th>Categoria</th><th>Preço</th><th>Quantidade</th><th>Ações</th></tr></thead>
          <tbody id="listaProdutos"></tbody>
        </table>
      </div>
      <p id="semProdutos" class="sem-produtos oculto">Nenhum produto cadastrado.</p>
    </section>
  </main>
  <script src="js/produtos.js"></script>
</body>
</html>
